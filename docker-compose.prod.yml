services:
  front:
    ports:
      - "80:80"
      - "443:443"
      - "5173:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./front/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
