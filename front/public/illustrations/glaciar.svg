<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Glaciar andino con deshielo">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim-drip { animation: none !important; }
    }
    .anim-drip {
      animation: dripFall 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes dripFall {
      0% { transform: translateY(0); opacity: 1; }
      80% { opacity: 0.9; }
      100% { transform: translateY(24px); opacity: 0; }
    }
  </style>

  <!-- Background circle -->
  <circle cx="80" cy="80" r="74" fill="#f0f9ff" stroke="#0284c7" stroke-width="3" />

  <!-- Mountain rock slopes -->
  <polygon points="80,18 20,135 140,135" fill="#475569" stroke="#1e293b" stroke-width="2.5" />

  <!-- Glacial Ice Sheet (Capa de nieve y hielo) -->
  <path d="M80 18 L44 95 Q60 85 80 92 Q100 85 116 95 Z" fill="url(#iceGrad)" stroke="#0284c7" stroke-width="2" />
  <!-- Crevasses / Grietas del glaciar -->
  <path d="M68 55 L74 68 M88 50 L84 64" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />

  <!-- Exposed grey and red moraine from glacier retreat -->
  <polygon points="20,135 55,105 75,135" fill="#78350f" opacity="0.8" />
  <polygon points="140,135 105,105 85,135" fill="#78350f" opacity="0.8" />

  <!-- Glacial Meltwater Lake / Laguna de deshielo at base -->
  <ellipse cx="80" cy="138" rx="48" ry="14" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
  <ellipse cx="80" cy="138" rx="36" ry="8" fill="#38bdf8" />

  <!-- Meltwater droplets falling with animation -->
  <g class="anim-drip">
    <path d="M80 96 C80 96 83 103 83 106 A3 3 0 0 1 77 106 C77 103 80 96 80 96 Z" fill="#38bdf8" />
  </g>
</svg>
