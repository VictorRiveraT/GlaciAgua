<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Manos lavándose con agua limpia">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim-bubbles { animation: none !important; }
    }
    .anim-bubbles {
      animation: bubbleFloat 2s ease-in-out infinite;
    }
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>

  <!-- Background circle -->
  <circle cx="80" cy="80" r="74" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" />

  <!-- Water tap / Spout or stream from above -->
  <path d="M72 16 L88 16 L88 36 L72 36 Z" fill="#94a3b8" stroke="#475569" stroke-width="2.5" />
  <rect x="68" y="32" width="24" height="6" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2" />

  <!-- Water stream flowing down -->
  <path d="M76 38 C76 60 70 85 70 95 L90 95 C90 85 84 60 84 38 Z" fill="#38bdf8" opacity="0.85" />
  <line x1="80" y1="42" x2="80" y2="90" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Two Hands gently washing -->
  <!-- Left hand -->
  <g transform="translate(15, 0)">
    <path d="M40 120 C35 110 40 92 55 92 C62 92 68 96 74 100 L85 106 C80 116 70 125 50 125 Z"
          fill="#fed7aa" stroke="#7c2d12" stroke-width="2.5" />
    <!-- Fingers -->
    <path d="M74 100 C80 96 90 98 94 104 C94 108 88 112 82 110" fill="#fed7aa" stroke="#7c2d12" stroke-width="2" />
  </g>

  <!-- Right hand cupping from other side -->
  <g transform="translate(-15, 0)">
    <path d="M120 120 C125 110 120 92 105 92 C98 92 92 96 86 100 L75 106 C80 116 90 125 110 125 Z"
          fill="#fed7aa" stroke="#7c2d12" stroke-width="2.5" />
    <path d="M86 100 C80 96 70 98 66 104 C66 108 72 112 78 110" fill="#fed7aa" stroke="#7c2d12" stroke-width="2" />
  </g>

  <!-- Soap bubbles and water splashes with animation -->
  <g class="anim-bubbles">
    <circle cx="68" cy="85" r="5" fill="#ffffff" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <circle cx="94" cy="88" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <circle cx="80" cy="115" r="6" fill="#ffffff" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <circle cx="56" cy="102" r="3" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  </g>
</svg>
