<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Lluvia sobre las montañas andinas">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim-rain { animation: none !important; }
    }
    .anim-rain {
      animation: rainDrop 1.8s linear infinite;
    }
    @keyframes rainDrop {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(18px); opacity: 0.2; }
    }
  </style>

  <!-- Background circle -->
  <circle cx="80" cy="80" r="74" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" />

  <!-- Green Andean slopes at base -->
  <path d="M10 135 Q50 115 90 128 Q125 110 150 135 L150 152 L10 152 Z" fill="#22c55e" stroke="#15803d" stroke-width="2" />

  <!-- Raindrops with falling animation -->
  <g class="anim-rain" stroke="#0284c7" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="92" x2="44" y2="104" />
    <line x1="68" y1="88" x2="64" y2="100" />
    <line x1="88" y1="92" x2="84" y2="104" />
    <line x1="108" y1="88" x2="104" y2="100" />

    <line x1="56" y1="108" x2="52" y2="120" />
    <line x1="76" y1="104" x2="72" y2="116" />
    <line x1="96" y1="108" x2="92" y2="120" />
  </g>

  <!-- Friendly Cloud (Nube) with happy face -->
  <g transform="translate(0, -5)">
    <!-- Cloud body -->
    <path d="M42 78 A20 20 0 0 1 65 52 A26 26 0 0 1 105 52 A18 18 0 0 1 126 78 A18 18 0 0 1 110 88 L46 88 A18 18 0 0 1 42 78 Z"
          fill="#93c5fd" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Rosy cheeks -->
    <circle cx="56" cy="74" r="3.5" fill="#f43f5e" opacity="0.4" />
    <circle cx="100" cy="74" r="3.5" fill="#f43f5e" opacity="0.4" />

    <!-- Cute smiling eyes -->
    <path d="M62 68 Q67 63 72 68" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" />
    <path d="M84 68 Q89 63 94 68" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M74 74 Q78 80 82 74" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
