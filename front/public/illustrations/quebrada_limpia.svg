<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Quebrada limpia de montaña">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim-stream { animation: none !important; }
    }
    .anim-stream {
      animation: streamFlow 3s linear infinite;
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -20; }
    }
  </style>

  <!-- Background circle -->
  <circle cx="80" cy="80" r="74" fill="#ecfeff" stroke="#0891b2" stroke-width="3" />

  <!-- Mountain slopes on both sides -->
  <path d="M10 65 L45 95 L10 150 Z" fill="#64748b" stroke="#334155" stroke-width="2" />
  <path d="M150 65 L115 95 L150 150 Z" fill="#64748b" stroke="#334155" stroke-width="2" />
  <!-- Green vegetation on banks -->
  <path d="M10 110 Q35 105 45 130 L10 150 Z" fill="#22c55e" />
  <path d="M150 110 Q125 105 115 130 L150 150 Z" fill="#22c55e" />

  <!-- Snow peak in background -->
  <polygon points="80,18 55,65 105,65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <polygon points="80,18 68,40 76,36 80,44 86,36 92,40" fill="#ffffff" />

  <!-- Clean Blue Creek Channel -->
  <path d="M80 65 C68 90 40 105 50 155 L110 155 C120 105 92 90 80 65 Z" fill="#38bdf8" />

  <!-- Flowing white water stream lines -->
  <g class="anim-stream" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6, 14">
    <path d="M80 72 C72 95 55 115 65 150" fill="none" />
    <path d="M80 72 C88 95 105 115 95 150" fill="none" />
  </g>

  <!-- Clean Grey River Stones -->
  <ellipse cx="60" cy="135" rx="8" ry="5" fill="#94a3b8" stroke="#475569" stroke-width="1.8" />
  <ellipse cx="98" cy="140" rx="9" ry="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.8" />
  <ellipse cx="78" cy="115" rx="6" ry="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />

  <!-- Green Seen Check Badge -->
  <circle cx="125" cy="35" r="14" fill="#16a34a" stroke="#ffffff" stroke-width="2.5" />
  <path d="M118 35 L123 40 L133 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>
