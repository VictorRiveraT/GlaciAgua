services:
  # 1. Microservicio de Machine Learning (Random Forest Predictor)
  api:
    container_name: glaciagua-ml-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - GLACIAGUA_CORS=*
    volumes:
      - ./api/modelo:/app/modelo
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/salud')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - glaciagua-net

  # 2. Backend Orquestador FastAPI (Cuencas, Reportes, SQLite, Proxy ML, Email)
  backend:
    container_name: glaciagua-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ML_API_URL=http://api:8001
      - GLACIAGUA_DB_PATH=/app/data/glaciagua.db
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-alertas@glaciagua.pe}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - glaciagua-net

  # 3. Frontend PWA (React 19 + TypeScript + Leaflet servido con Nginx)
  front:
    container_name: glaciagua-front
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - glaciagua-net

networks:
  glaciagua-net:
    driver: bridge
